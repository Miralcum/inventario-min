{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block clase_body %}bg-light-gray{% endblock %}

{% block cuerpo %}
{# Página de error de la plantilla (404.html de Mono) #}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh">
  <div class="d-flex flex-column justify-content-between">
    <div class="row justify-content-center mt-5">
      <div class="text-center page-404">
        <h1 class="error-title">{{ codigo }}</h1>
        <p class="pt-4 pb-2 error-subtitle">{{ titulo }}</p>
        <p class="pb-5">{{ mensaje }}</p>
        <a href="{{ url_for('inicio') }}" class="btn btn-primary btn-pill">Volver al panel principal</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
